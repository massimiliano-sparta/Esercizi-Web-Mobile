<html lang="it">
<head>

<body>
    <main>
        <p class="torna-home"><a href="index.html">&larr; Torna alla home</a></p>

        <h1>Le mie attività</h1>
        <p class="sottotitolo">Demo didattica: HTML/CSS/JS + PHP + MySQL + API REST</p>

        <!-- Form per creare una nuova attività (POST) -->
        <form id="form-nuova-attivita">
            <input type="text" id="input-titolo" placeholder="Titolo attività" required>
            <input type="text" id="input-descrizione" placeholder="Descrizione (opzionale)">
            <input type="date" id="input-scadenza">
            <button type="submit">Aggiungi</button>
        </form>

        <ul id="lista-attivita"></ul>
